name: Code Quality
# Code quality / formatting checks ported from sw-backupit (composer validate,
# audit, PHPCS with WordPress Coding Standards, PHPStan level 8).
on:
  pull_request: null
  push:
    branches:
      - main

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, redis
        tools: composer:v2
        coverage: none
    - run: composer install --prefer-dist --no-interaction --no-progress
    - run: composer validate --strict
    - name: Audit shipped Composer packages
      run: composer audit --locked --no-dev
    - run: composer cs && composer stan
